name: Build GawharaMissions

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    name: Build against Paper 26.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify JAR contents
        run: |
          test -f target/GawharaMissions-1.0.3.jar
          jar tf target/GawharaMissions-1.0.3.jar | grep -F "com/gawharasmp/missions/GawharaMissions.class"
          jar tf target/GawharaMissions-1.0.3.jar | grep -F "plugin.yml"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GawharaMissions-1.0.3
          path: target/GawharaMissions-1.0.3.jar
          if-no-files-found: error
          retention-days: 14
