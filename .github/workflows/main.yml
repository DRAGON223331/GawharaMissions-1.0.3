name: Build GawharaMissions

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build GawharaMissions JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Maven project version
        run: |
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "Maven project version: $VERSION"

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Find and verify generated JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          echo "Contents of target/:"
          ls -lah target/
          mapfile -t JARS < <(find target -maxdepth 1 -type f -name 'GawharaMissions-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ ${#JARS[@]} -ne 1 ]]; then
            echo "Expected exactly one GawharaMissions JAR, found ${#JARS[@]}"
            exit 1
          fi
          JAR_FILE="${JARS[0]}"
          test -s "$JAR_FILE"
          jar tf "$JAR_FILE" | grep -qx 'plugin.yml'
          jar tf "$JAR_FILE" | grep -qx 'com/gawharasmp/missions/GawharaMissions.class'
          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          echo "Verified JAR: $JAR_FILE"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: GawharaMissions-JAR
          path: ${{ steps.jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
