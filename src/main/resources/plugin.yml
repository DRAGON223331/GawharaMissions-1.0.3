name: GawharaMissions
version: 1.1.0
main: com.gawharasmp.missions.GawharaMissions
api-version: '26.3'
authors: [GawharaSMP]
description: Daily and weekly missions with GawharaCoins rewards.
depend: [GawharaCoins]
commands:
  missions:
    description: Open your daily and weekly missions.
    usage: /missions [daily|weekly|reload]
    aliases: [mission, tasks]
permissions:
  gawharamissions.use:
    description: Allows players to view and progress missions.
    default: true
  gawharamissions.admin:
    description: Allows reloading GawharaMissions.
    default: op
